<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Prime Agent Studio</title>
    <link rel="stylesheet" href="desktop.css" />
    <script src="desktop.js" defer></script>
  </head>
  <body class="boot boot-connecting">
    <main>
      <header>
        <img src="icon.png" alt="" width="48" height="48" /><span>Prime Agent Studio</span
        ><span class="platform">WINDOWS</span>
      </header>
      <section class="intro">
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="title"></h1>
        <p class="description" id="description"></p>
      </section>
      <section id="components" class="setup" aria-labelledby="components-heading" hidden>
        <div class="component-heading">
          <h2 id="components-heading"></h2>
          <button
            id="components-toggle"
            class="text-button"
            aria-expanded="false"
            aria-controls="components-details"
          ></button>
        </div>
        <ol id="components-list" class="setup-list"></ol>
        <div id="setup-meter" class="setup-meter" hidden>
          <div class="meter" aria-hidden="true"><span id="setup-meter-fill"></span></div>
          <p id="setup-meter-label"></p>
        </div>
        <p id="components-status" role="status" aria-live="polite"></p>
        <div id="components-actions" class="update-actions">
          <button id="components-install" class="primary"></button>
          <button id="components-cancel" class="text-button" hidden></button>
        </div>
        <div id="components-details" hidden>
          <p id="components-note"></p>
          <ul id="components-detail-list"></ul>
          <button id="components-diagnose" class="text-button"></button>
          <details>
            <summary id="components-existing"></summary>
            <p id="components-existing-note"></p>
            <div class="update-actions">
              <button id="components-engine" class="text-button">Prime Agent</button>
              <button id="components-uv" class="text-button">uv</button>
              <button id="components-python" class="text-button">Python</button>
            </div>
          </details>
        </div>
      </section>
      <section id="updates" class="updates" aria-labelledby="update-heading" hidden>
        <div class="update-heading">
          <h2 id="update-heading"></h2>
          <span id="app-version"></span>
        </div>
        <p id="update-status" role="status" aria-live="polite"></p>
        <progress id="update-progress" max="100" hidden></progress>
        <details id="update-notes" hidden>
          <summary id="update-notes-label"></summary>
          <div id="update-notes-body" class="update-notes-body"></div>
        </details>
        <p id="update-impact" hidden></p>
        <div class="update-actions">
          <button id="update-check" class="text-button"></button
          ><button id="update-install" class="primary" hidden></button
          ><button id="update-cancel" class="text-button" hidden></button>
        </div>
        <div class="server-update">
          <h2 id="server-heading"></h2>
          <p id="server-state" role="status"></p>
          <p id="server-agents"></p>
          <button id="server-restart" class="text-button" disabled></button>
        </div>
      </section>
      <div id="progress" role="status" hidden>
        <span class="pulse"></span><span id="progress-text"></span>
      </div>
      <div id="error" role="alert" hidden></div>
      <div class="actions">
        <button id="start" class="primary" disabled></button
        ><button id="back-studio" class="text-button" hidden></button
        ><button id="logs" class="text-button" hidden></button>
      </div>
      <section id="choices" class="options" aria-labelledby="options-heading" hidden>
        <h2 id="options-heading"></h2>
        <label class="preference"
          ><span><strong id="startup-label"></strong><small id="startup-note"></small></span
          ><input id="autostart" type="checkbox" role="switch"
        /></label>
        <div class="import">
          <button id="import" class="text-button"></button>
          <p id="import-note"></p>
          <p id="source" hidden></p>
        </div>
      </section>
      <footer>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M4 12h3l3-7 4 14 3-7h3" /></svg
        ><span id="footer"></span>
      </footer>
    </main>
    <dialog
      id="restart-confirm"
      aria-labelledby="restart-confirm-title"
      aria-describedby="restart-confirm-note"
    >
      <h2 id="restart-confirm-title"></h2>
      <p id="restart-confirm-note"></p>
      <div class="update-actions">
        <button id="restart-cancel" class="text-button" autofocus></button>
        <button id="restart-proceed" class="primary"></button>
      </div>
    </dialog>
    <dialog
      id="quit-confirm"
      aria-labelledby="quit-confirm-title"
      aria-describedby="quit-confirm-note"
    >
      <h2 id="quit-confirm-title"></h2>
      <p id="quit-confirm-note"></p>
      <p id="quit-confirm-detail" hidden></p>
      <div class="update-actions">
        <button id="quit-cancel" class="text-button" autofocus></button>
        <button id="quit-proceed" class="primary"></button>
      </div>
    </dialog>
  </body>
</html>
